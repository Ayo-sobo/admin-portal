<nz-layout class="layout">
    <nz-sider [ngClass]="{ open: isMobileMenuOpen }" nzCollapsible [nzCollapsed]="isCollapsed" nzBreakpoint="lg">
        <div class="logo">
            <h3 *ngIf="!isCollapsed">Admin Portal</h3>
            <h3 *ngIf="isCollapsed">AP</h3>
        </div>

        <ul nz-menu nzTheme="dark" nzMode="inline">
            <li nz-menu-item nzMatchRouter>
                <a routerLink="/home">
                    <span nz-icon nzType="home"></span>
                    <span>Home</span>
                </a>
            </li>
            <li nz-menu-item nzMatchRouter>
                <a routerLink="/devices">
                    <span nz-icon nzType="mobile"></span>
                    <span>Devices and Vitals</span>
                </a>
            </li>
            <li nz-menu-item nzMatchRouter>
                <a routerLink="/users">
                    <span nz-icon nzType="team"></span>
                    <span>User Management</span>
                </a>
            </li>
        </ul>

        <div class="logout-container">
            <button nz-button nzDanger nzBlock (click)="logout()">
                <span nz-icon nzType="logout"></span>
                <span *ngIf="!isCollapsed">Logout</span>
            </button>
        </div>
    </nz-sider>

    <div class="sidemenu-overlay" [ngClass]="{ show: isMobileMenuOpen }" (click)="closeMobileMenu()"></div>

    <nz-layout>
        <nz-header>
            <div class="header-content">
                <span nz-icon class="trigger" nzType="menu" (click)="toggleMobileMenu()"></span>
                <h2>Dashboard</h2>
            </div>
        </nz-header>

        <nz-content>
            <div class="inner-content">
                <router-outlet></router-outlet>
            </div>
        </nz-content>

        <nz-footer>Admin Portal ©2025</nz-footer>
    </nz-layout>
</nz-layout>
